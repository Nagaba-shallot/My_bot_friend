<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nasha</title>
<style>
  :root {
    --bg: #1a1523;
    --panel: #251d33;
    --accent: #c9a4ff;
    --accent-soft: #7c5fa3;
    --text: #f0eaf9;
    --text-dim: #a89bc2;
    --bubble-user: #3d2f52;
    --bubble-bot: #2e2440;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #3a2f4d;
  }
  header h1 {
    margin: 0;
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 4px 0 0;
    color: var(--text-dim);
    font-size: 0.85rem;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    padding: 10px 15px;
    border-radius: 16px;
    max-width: 75%;
    line-height: 1.4;
    font-size: 0.95rem;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border-bottom-left-radius: 4px;
  }
  .msg.typing {
    color: var(--text-dim);
    font-style: italic;
  }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid #3a2f4d;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 999px;
    border: 1px solid #443a58;
    background: var(--panel);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
  }
  input:focus { border-color: var(--accent-soft); }
  button {
    padding: 12px 20px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #241a33;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #voice-btn {
    background: var(--bubble-bot);
    color: var(--text);
    border: 1px solid #443a58;
  }
  #voice-btn.on {
    background: var(--accent);
    color: #241a33;
  }
  #voice-btn.listening {
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>

<header>
  <h1>Nasha</h1>
  <p>here whenever you want to talk</p>
</header>

<div id="chat"></div>

<form id="chat-form">
  <button id="voice-btn" type="button" title="Toggle voice mode">🎙️</button>
  <input id="input" type="text" placeholder="Say something..." autocomplete="off" autofocus>
  <button id="send-btn" type="submit">Send</button>
</form>

<script>
const chatEl = document.getElementById('chat');
const form = document.getElementById('chat-form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const voiceBtn = document.getElementById('voice-btn');

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

// --- Voice: speech-to-text (mic) + text-to-speech (spoken replies) --------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
let voiceModeOn = false;

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel(); // stop anything already talking
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1.0;
  utterance.onend = () => {
    // hands-free loop: once she's done talking, start listening again
    if (voiceModeOn) startListening();
  };
  window.speechSynthesis.speak(utterance);
}

function startListening() {
  if (!SpeechRecognition) {
    alert('Voice input needs Chrome (or another browser that supports the Web Speech API).');
    voiceModeOn = false;
    voiceBtn.classList.remove('on');
    return;
  }
  recognizer = new SpeechRecognition();
  recognizer.lang = 'en-US';
  recognizer.interimResults = false;
  recognizer.maxAlternatives = 1;

  voiceBtn.classList.add('listening');

  recognizer.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    input.value = transcript;
    form.requestSubmit();
  };
  recognizer.onerror = (event) => {
    console.warn('Speech recognition error:', event.error);
    voiceBtn.classList.remove('listening');
  };
  recognizer.onend = () => {
    voiceBtn.classList.remove('listening');
  };

  recognizer.start();
}

voiceBtn.addEventListener('click', () => {
  voiceModeOn = !voiceModeOn;
  voiceBtn.classList.toggle('on', voiceModeOn);
  if (voiceModeOn) {
    startListening();
  } else {
    window.speechSynthesis.cancel();
    if (recognizer) recognizer.abort();
  }
});
// ---------------------------------------------------------------------------

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, 'user');
  input.value = '';
  sendBtn.disabled = true;

  const typingEl = addMessage('...', 'bot typing');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message }),
    });
    const data = await res.json();
    typingEl.remove();
    if (data.error) {
      addMessage("Something went wrong: " + data.error, 'bot');
    } else {
      addMessage(data.reply, 'bot');
      if (voiceModeOn) speak(data.reply);
    }
  } catch (err) {
    typingEl.remove();
    addMessage("Couldn't reach the server — check your connection.", 'bot');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>

</body>
</html>
